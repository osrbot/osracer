line-length = 120
target-version = "py310"

exclude = [
    "osracer_dependency/",
    "osracer_bringup/script/test/",
]

[lint]
# F = pyflakes (real bugs: unused imports, undefined names, etc.)
# E9 = syntax errors
# W6 = deprecated features
select = ["F", "E9", "W6"]

# Ignore F401 on __init__.py (re-exports are intentional)
per-file-ignores = { "__init__.py" = ["F401"] }
