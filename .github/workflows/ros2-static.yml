name: ROS2 Static Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  package-xml:
    name: package.xml validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install catkin_pkg
        run: pip install catkin_pkg

      - name: Validate package.xml files
        run: |
          python3 - <<'EOF'
          import sys
          import glob
          from catkin_pkg.package import parse_package

          errors = []
          for path in glob.glob("**/package.xml", recursive=True):
              if "osracer_dependency" in path:
                  continue
              try:
                  pkg = parse_package(path)
                  print(f"OK: {path} (name={pkg.name}, version={pkg.version})")
                  # Warn on placeholder values
                  if pkg.version == "0.0.0":
                      print(f"  WARN: {path} has placeholder version 0.0.0")
                  for m in pkg.maintainers:
                      if "todo" in m.email.lower():
                          print(f"  WARN: {path} has placeholder maintainer email: {m.email}")
              except Exception as e:
                  errors.append(f"FAIL: {path}: {e}")
                  print(f"FAIL: {path}: {e}")

          if errors:
              sys.exit(1)
          EOF

  launch-syntax:
    name: Launch file syntax check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"

      - name: Check Python launch files compile
        run: |
          python3 - <<'EOF'
          import sys
          import ast
          import glob

          errors = []
          for path in glob.glob("**/launch/*.py", recursive=True):
              if "osracer_dependency" in path:
                  continue
              try:
                  with open(path) as f:
                      source = f.read()
                  ast.parse(source)
                  print(f"OK: {path}")
              except SyntaxError as e:
                  errors.append(f"FAIL: {path}: {e}")
                  print(f"FAIL: {path}: {e}")

          if errors:
              sys.exit(1)
          EOF

      - name: Check XML launch files are valid XML
        run: |
          python3 - <<'EOF'
          import sys
          import glob
          import xml.etree.ElementTree as ET

          errors = []
          for path in glob.glob("**/launch/*.xml", recursive=True):
              if "osracer_dependency" in path:
                  continue
              try:
                  ET.parse(path)
                  print(f"OK: {path}")
              except ET.ParseError as e:
                  errors.append(f"FAIL: {path}: {e}")
                  print(f"FAIL: {path}: {e}")

          if errors:
              sys.exit(1)
          EOF

  python-imports:
    name: Unused import detection
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"

      - name: Install autoflake
        run: pip install autoflake

      - name: Check for unused imports
        run: |
          autoflake \
            --check \
            --remove-unused-variables \
            --remove-all-unused-imports \
            osracer_bringup/script/led_matrix.py \
            tests/test_osracer_base_integration.py

  osracer-base-integration:
    name: Pinned osracer_base integration
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Isolate ROS setup from the preinstalled Firefox snap
        run: |
          if dpkg-query -W -f='${Status}' firefox 2>/dev/null | \
            grep -q '^install ok installed$'; then
            sudo apt-mark hold firefox
          fi

      - uses: ros-tooling/setup-ros@649ef6bcd696da05bc27ceb3fab69d810c0daeab
        with:
          required-ros-distributions: humble

      - name: Import the pinned ROS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-vcstool \
            ros-humble-nav2-behaviors \
            ros-humble-ros2lifecycle
          mkdir -p "$RUNNER_TEMP/osracer_ws/src"
          # vcstool 0.3.0 validate crashes on immutable commit SHA versions.
          # The manifest contract test and exact post-import HEAD check validate the pin.
          vcs import "$RUNNER_TEMP/osracer_ws/src" < osracer.repos
          test "$(git -C "$RUNNER_TEMP/osracer_ws/src/osracer_base" rev-parse HEAD)" = \
            "6f9fabee09b9f6fe90d78497ba25c1f388a5e885"
          test "$(git -C "$GITHUB_WORKSPACE/osracer_dependency" rev-parse HEAD)" = \
            "4317556c6ea38bd149144136c9dbee6a53a1076e"
          for dependency_path in \
            Lakibeam_ROS2_Driver camera_calibration ros2_gmapping teb_local_planner; do
            touch "$GITHUB_WORKSPACE/osracer_dependency/$dependency_path/COLCON_IGNORE"
          done
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/osracer_ws/src/osracer"

      - name: Validate the product launch contract against the dependency
        env:
          OSRACER_BASE_SOURCE: ${{ runner.temp }}/osracer_ws/src/osracer_base
        run: python3 -m unittest discover -s tests -p 'test_osracer_base_integration.py' -v

      - name: Install workspace build and test dependencies
        run: |
          source /opt/ros/humble/setup.bash
          rosdep update --rosdistro humble
          rosdep install \
            --from-paths "$RUNNER_TEMP/osracer_ws/src" \
            --ignore-src --rosdistro humble \
            --dependency-types build \
            --dependency-types buildtool \
            --dependency-types build_export \
            --dependency-types test \
            --skip-keys ament_python -y

      - name: Run Base protocol and mismatch regression
        run: |
          source /opt/ros/humble/setup.bash
          PYTHONDONTWRITEBYTECODE=1 python3 -B \
            "$RUNNER_TEMP/osracer_ws/src/osracer_base/test/test_chassis_driver.py" \
            ConnectionLifecycleTests.test_unsupported_protocol_and_profile_mismatch_fail_before_stream \
            -v

      - name: Build product packages and the recovery dependency
        run: |
          source /opt/ros/humble/setup.bash
          cd "$RUNNER_TEMP/osracer_ws"
          colcon build --event-handlers console_direct+
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

      - name: Validate installed launch and reference packages
        run: |
          source /opt/ros/humble/setup.bash
          source "$RUNNER_TEMP/osracer_ws/install/setup.bash"
          cd "$RUNNER_TEMP/osracer_ws"
          test -x install/osracer_base/lib/osracer_base/chassis_driver
          test -z "$(find install/osracer_bringup -type f -name chassis_ackermann.py -print -quit)"
          ros2 launch osracer_bringup chassis_ackermann.launch.py --show-args
          ros2 launch osracer_race race_bringup.launch.py --show-args
          ros2 launch osracer_sim base_sim.launch.py --show-args
          bash install/osracer_race/share/osracer_race/scripts/validate_race_ros.sh
          bash install/osracer_sim/share/osracer_sim/scripts/validate_sim_ros.sh
          for params in dwb_nav2_params.yaml teb_nav2_params.yaml; do
            timeout --signal=INT --kill-after=5s 30s \
              bash install/osracer_navigation/share/osracer_navigation/scripts/validate_behavior_server.sh \
              "install/osracer_navigation/share/osracer_navigation/params/$params"
          done

      - name: Start the real launch with a missing serial device
        run: |
          source /opt/ros/humble/setup.bash
          source "$RUNNER_TEMP/osracer_ws/install/setup.bash"
          test ! -e /dev/osracer_ci_missing
          smoke_log="$RUNNER_TEMP/osracer_chassis_missing_device.log"
          set +e
          timeout --signal=INT --kill-after=2s 5s \
            ros2 launch osracer_bringup chassis_ackermann.launch.py \
              port_name:=/dev/osracer_ci_missing use_ekf:=False \
              >"$smoke_log" 2>&1
          smoke_status=$?
          set -e
          cat "$smoke_log"
          test "$smoke_status" -eq 124
          grep -F "Serial device not found: /dev/osracer_ci_missing" "$smoke_log"
          if grep -E \
            "Traceback|vehicle_profile must be selected explicitly|process has died" \
            "$smoke_log"; then
            exit 1
          fi
