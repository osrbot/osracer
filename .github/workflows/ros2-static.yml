name: ROS2 Static Checks

on:
  push:
    branches: [product/neo]
  pull_request:
    branches: [product/neo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-xml:
    name: package.xml validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install catkin_pkg
        run: pip install catkin_pkg

      - name: Validate package.xml files
        run: |
          python3 - <<'EOF'
          import sys
          import glob
          from catkin_pkg.package import parse_package

          errors = []
          for path in glob.glob("**/package.xml", recursive=True):
              if "osracer_dependency" in path:
                  continue
              try:
                  pkg = parse_package(path)
                  print(f"OK: {path} (name={pkg.name}, version={pkg.version})")
                  # Warn on placeholder values
                  if pkg.version == "0.0.0":
                      print(f"  WARN: {path} has placeholder version 0.0.0")
                  for m in pkg.maintainers:
                      if "todo" in m.email.lower():
                          print(f"  WARN: {path} has placeholder maintainer email: {m.email}")
              except Exception as e:
                  errors.append(f"FAIL: {path}: {e}")
                  print(f"FAIL: {path}: {e}")

          if errors:
              sys.exit(1)
          EOF

  launch-syntax:
    name: Launch file syntax check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Check Python launch files compile
        run: |
          python3 - <<'EOF'
          import sys
          import ast
          import glob

          errors = []
          for path in glob.glob("**/launch/*.py", recursive=True):
              if "osracer_dependency" in path:
                  continue
              try:
                  with open(path) as f:
                      source = f.read()
                  ast.parse(source)
                  print(f"OK: {path}")
              except SyntaxError as e:
                  errors.append(f"FAIL: {path}: {e}")
                  print(f"FAIL: {path}: {e}")

          if errors:
              sys.exit(1)
          EOF

      - name: Check XML launch files are valid XML
        run: |
          python3 - <<'EOF'
          import sys
          import glob
          import xml.etree.ElementTree as ET

          errors = []
          for path in glob.glob("**/launch/*.xml", recursive=True):
              if "osracer_dependency" in path:
                  continue
              try:
                  ET.parse(path)
                  print(f"OK: {path}")
              except ET.ParseError as e:
                  errors.append(f"FAIL: {path}: {e}")
                  print(f"FAIL: {path}: {e}")

          if errors:
              sys.exit(1)
          EOF

  python-imports:
    name: Unused import detection
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install autoflake
        run: pip install autoflake

      - name: Check for unused imports
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR \
              "${BASE_SHA}" "${GITHUB_SHA}" -- '*.py'
          )
          if ((${#files[@]} == 0)); then
            echo "No changed Python files."
          else
            autoflake \
              --check \
              --remove-unused-variables \
              --remove-all-unused-imports \
              "${files[@]}"
          fi
