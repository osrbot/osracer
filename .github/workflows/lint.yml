name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    name: Python (ruff)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff

      # ruff.toml at repo root controls rules (F + E9 + W6 only — real bugs, no style)
      - name: ruff check
        run: ruff check .

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"

      - name: Install yamllint
        run: pip install yamllint

      - name: yamllint
        run: |
          # ROS parameter files contain generated matrices and upstream formatting.
          # Keep syntax and basic file-hygiene checks without rewriting parameter data.
          yamllint \
            osracer_bringup/param/ \
            osracer_navigation/params/ \
            osracer_slam/param/ \
            -d "{extends: default, rules: {brackets: disable, comments: disable, comments-indentation: disable, document-start: disable, indentation: disable, line-length: disable, commas: disable, truthy: disable}}"
