name: Lint

on:
  push:
    branches: [product/neo]
  pull_request:
    branches: [product/neo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-lint:
    name: Python (ruff)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff

      # ruff.toml at repo root controls rules (F + E9 + W6 only — real bugs, no style)
      - name: ruff check
        run: ruff check .

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install yamllint
        run: pip install yamllint

      - name: yamllint
        run: |
          yamllint \
            osracer_bringup/param/ \
            osracer_navigation/params/ \
            osracer_slam/param/ \
            -d "{extends: default, rules: {line-length: {max: 120}, truthy: disable}}"
