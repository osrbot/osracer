---
name: Firmware Client

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Client unit and regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"

      - name: Run focused client tests
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python3 -B tests/test_firmware_client.py -v

      - name: Run inherited transport regression tests
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python3 -B tests/test_firmware_client_core.py -q

      - name: Validate Python syntax and embedded packages
        run: |
          python3 -m compileall -q osracer_firmware_client tools/firmware_client_entry.py
          PYTHONPATH=. python3 -B -m osracer_firmware_client bundles >/dev/null

  linux-arm64-package:
    name: Standalone Linux ARM64 package
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"

      - name: Build and smoke-test the self-contained executable
        run: tools/build_firmware_client.sh

      - name: Verify Linux ARM64 output
        run: |
          file dist/firmware-client/osracer-firmware-client | grep -E 'ELF 64-bit.*ARM aarch64'
          dist/firmware-client/osracer-firmware-client bundles >/dev/null
          dist/firmware-client/osracer-firmware-client build-info >/dev/null
          dist/firmware-client/osracer-firmware-client licenses >/dev/null
          dist/firmware-client/osracer-firmware-client --help >/dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: osracer-firmware-client-linux-aarch64
          path: |
            dist/firmware-client/osracer-firmware-client
            dist/firmware-client/osracer-firmware-client.sha256
          if-no-files-found: error
          retention-days: 7
